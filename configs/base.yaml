# Shared base config — every experiments/*.yaml overrides only what differs.
model_name: Qwen/Qwen2.5-0.5B
rank: 32
alpha: 64
gralora_k: 2
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
gora_n_batches: 64
altlora_momentum: 0.9
epochs: 1.0
batch_size: 8
grad_accum: 4
lr: 2e-4
seed: 1
fp16: true
# ON: without it, activations (batch 8x512) + fp32 logits (2.3 GiB) push 0.5B fp16
# training to ~13 GB on T4 14.6 -> OOM (stage1, 2026-11-02). Costs ~+35% step time.
gradient_checkpointing: true
timeguard_minutes: 630
ckpt_every_steps: 500
out_dir: results
ckpt_dir: ckpt
data:
  name: metamathqa
  subset_size: 20000
  seq_len: 512
  eval_name: gsm8k
  eval_size: 200
